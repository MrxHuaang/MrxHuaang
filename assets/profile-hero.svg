<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Juan Ordonez profile hero</title>
  <desc id="desc">Monochrome GitHub profile banner for Juan Ordonez, CTO at Hyvento and software engineer from Colombia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.42" stop-color="#050505"/>
      <stop offset="0.75" stop-color="#111111"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>
    <linearGradient id="silver" x1="104" y1="72" x2="1086" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.66" stop-color="#A3A3A3" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="spot" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 82) rotate(147) scale(540 260)">
      <stop stop-color="#FFFFFF" stop-opacity="0.17"/>
      <stop offset="0.42" stop-color="#A3A3A3" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#spot)"/>

  <g opacity="0.92">
    <path d="M96 270C221 154 360 296 485 178C620 50 713 165 835 90C940 25 1037 72 1122 136" stroke="url(#silver)" stroke-width="2"/>
    <path d="M142 300C282 204 390 245 506 155C625 63 758 261 860 174C942 104 1030 143 1120 218" stroke="url(#silver)" stroke-width="1.2" stroke-dasharray="7 10"/>
    <path d="M74 124H1094" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M74 304H1094" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>

  <g filter="url(#blur)" opacity="0.7">
    <circle cx="172" cy="250" r="5" fill="#FFFFFF"/>
    <circle cx="485" cy="178" r="5" fill="#FFFFFF"/>
    <circle cx="835" cy="90" r="5" fill="#D4D4D4"/>
    <circle cx="1048" cy="188" r="5" fill="#FFFFFF"/>
  </g>
  <g>
    <circle cx="172" cy="250" r="3.5" fill="#FFFFFF"/>
    <circle cx="485" cy="178" r="3.5" fill="#F5F5F5"/>
    <circle cx="835" cy="90" r="3.5" fill="#D4D4D4"/>
    <circle cx="1048" cy="188" r="3.5" fill="#FFFFFF"/>
  </g>

  <g transform="translate(76 74)">
