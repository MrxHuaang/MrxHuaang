<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Profile footer</title>
  <desc id="desc">Monochrome footer with signal lines and the text Construyendo sistemas reales desde Colombia.</desc>
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1200" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#111111"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="shine" x1="160" y1="28" x2="1040" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="180" rx="24" fill="url(#footerBg)"/>
  <rect width="1200" height="180" rx="24" fill="url(#dots)"/>
  <path d="M76 92C174 34 278 150 394 88C512 25 625 142 746 82C846 33 958 54 1122 118" stroke="url(#shine)" stroke-width="2"/>
  <path d="M80 132H1120" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <path d="M80 46H1120" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="600" y="88" fill="#FFFFFF" text-anchor="middle" font-size="28" font-weight="800">Construyendo sistemas reales desde Colombia.</text>
    <text x="600" y="120" fill="#A3A3A3" text-anchor="middle" font-size="15" font-weight="600">product / realtime / infrastructure / visibility</text>
  </g>
  <g fill="#FFFFFF">
    <circle cx="246" cy="107" r="3" opacity="0.9"/>
    <circle cx="522" cy="61" r="3" opacity="0.75"/>
    <circle cx="748" cy="82" r="3" opacity="0.8"/>
    <circle cx="992" cy="80" r="3" opacity="0.7"/>
