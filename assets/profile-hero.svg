    <text x="0" y="101" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="800">Juan Ordo&#241;ez</text>
    <text x="2" y="143" fill="#D4D4D4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500">CTO @ Hyvento  /  Software Engineer  /  Colombia</text>

    <g transform="translate(0 183)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">
      <rect x="0" y="0" width="112" height="34" rx="17" fill="#050505" stroke="#2A2A2A"/>
      <text x="20" y="22" fill="#F5F5F5">Next.js</text>
      <rect x="126" y="0" width="72" height="34" rx="17" fill="#0A0A0A" stroke="#2A2A2A"/>
      <text x="150" y="22" fill="#F5F5F5">Go</text>
      <rect x="212" y="0" width="86" height="34" rx="17" fill="#111111" stroke="#333333"/>
      <text x="235" y="22" fill="#F5F5F5">Rust</text>
      <rect x="312" y="0" width="96" height="34" rx="17" fill="#171717" stroke="#3A3A3A"/>
      <text x="335" y="22" fill="#F5F5F5">WASM</text>
      <rect x="422" y="0" width="112" height="34" rx="17" fill="#111111" stroke="#333333"/>
      <text x="445" y="22" fill="#F5F5F5">WebRTC</text>
      <rect x="548" y="0" width="126" height="34" rx="17" fill="#050505" stroke="#2A2A2A"/>
      <text x="568" y="22" fill="#F5F5F5">Realtime</text>
    </g>
  </g>

  <g transform="translate(900 236)">
    <rect x="0" y="0" width="222" height="58" rx="16" fill="#000000" fill-opacity="0.72" stroke="#333333"/>
    <circle cx="30" cy="29" r="8" fill="#FFFFFF"/>
    <circle cx="30" cy="29" r="13" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="52" y="25" fill="#F5F5F5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">BUILDING</text>
    <text x="52" y="42" fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">server-auth products</text>
  </g>
