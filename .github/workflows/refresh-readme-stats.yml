name: Refresh README stats

on:
  workflow_dispatch:
  schedule:
    # Refresh after the GitHub contribution day has rolled over in Bogota.
    - cron: "20 5 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update stats cache buster
        shell: bash
        run: |
          set -euo pipefail
          export today="$(TZ=America/Bogota date +%F)"

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("README.md")
          today = os.environ["today"]
          text = path.read_text(encoding="utf-8")
          text = re.sub(r"cache_bust=\\d{4}-\\d{2}-\\d{2}", f"cache_bust={today}", text)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit README refresh
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet README.md; then
            echo "README stats already refreshed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh readme stats cache"
          git push
